<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Option B Monogram Metallic Flame Gradient -->
    <linearGradient id="optb-gold" x1="10%" y1="5%" x2="90%" y2="95%">
      <stop offset="0%" stop-color="#F7B52C" />
      <stop offset="25%" stop-color="#F39C12" />
      <stop offset="55%" stop-color="#E67E22" />
      <stop offset="85%" stop-color="#D35400" />
      <stop offset="100%" stop-color="#A04000" />
