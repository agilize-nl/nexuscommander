name: Bug report
description: Something in NexusCommander isn't working the way it should
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps from a fresh page load, if possible.
      placeholder: |
        1. Open two panels, navigate to ...
        2. Select a file and press F5
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: NexusCommander version
      description: From the Options dialog, or `package.json` if running from source.
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Running mode
      options:
        - Dev (npm start)
        - Standalone/production (npm run build + serve)
        - Installed as PWA
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser & OS
      placeholder: e.g. Chrome 126 on Linux, Chrome on ChromeOS, Android Chrome
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console / server logs
      description: Browser devtools console output and/or terminal output from the Express server, if any.
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, archive types involved, whether it's headless/remote, etc.
