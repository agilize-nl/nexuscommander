name: Feature request
description: Suggest an idea or improvement for NexusCommander
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that NexusCommander doesn't support (well) today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it working. Norton/Total/Double Commander comparisons are welcome if relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you're using today, or other tools that do this.

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Mockups, links, related issues.
